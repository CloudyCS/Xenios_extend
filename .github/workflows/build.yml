name: Build (reusable)

# Callable from CI.yml. The caller grants `actions: write` so sccache can
# populate the GHA cache; fork PRs get a read-only token from GitHub anyway, so
# sccache self-demotes to read-only on its startup write probe there.
on:
  workflow_call:
    inputs:
      build_ios_unsigned:
        description: Build the iOS unsigned IPA job from a reusable-workflow caller
        required: false
        type: boolean
        default: false
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Setup
        run: |
          pipx install clang-format==21.1.8
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Lint
        run: ./xenia-build.py lint --all

  build-linux:
    name: Build Linux
    needs: lint
    # Build on the oldest supported LTS so the AppImage's glibc floor (taken from
    # the build host) stays low enough for Ubuntu 22.04 / Debian 12 users.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Cache linuxdeploy tools
        id: cache-linuxdeploy
        uses: actions/cache@v5
        with:
          path: ~/linuxdeploy
          key: ${{ runner.os }}-linuxdeploy-tools
          restore-keys: |
            ${{ runner.os }}-linuxdeploy-

      - name: Cache Slang
        id: cache-slang
        uses: actions/cache@v5
        with:
          path: .slang
          # Keep in sync with SLANG_VERSION in xenia-build.py.
          key: ${{ runner.os }}-${{ runner.arch }}-slang-2026.8

      - name: Download Slang
        if: steps.cache-slang.outputs.cache-hit != 'true'
        run: ./xenia-build.py slang

      - name: Cache apt packages
        uses: actions/cache@v5
        with:
          path: |
            ~/apt-archives
            ~/apt-lists
          # Saved together, so the indices and the .debs they name always agree.
          # Stable key: fetched once, reused after. Bump the version to refresh.
          key: ${{ runner.os }}-apt-jammy-clang21-gcc14-v1

      - name: Setup
        run: |
          UBUNTU_BASE=$(lsb_release -cs)
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          # --no-update on both, then one update below; each add-apt-repository
          # otherwise refetches every index.
          sudo apt-add-repository --no-update "deb http://apt.llvm.org/${UBUNTU_BASE}/ llvm-toolchain-${UBUNTU_BASE}-21 main"
          # jammy's default libstdc++ is GCC 12, whose <ranges> Clang can't
          # compile; GCC 13's <chrono> then trips a consteval bug. g++-14 is
          # the first libstdc++ Clang compiles cleanly (and what 24.04 ships).
          sudo add-apt-repository -y --no-update ppa:ubuntu-toolchain-r/test

          # restricted is 15 MB of the index and holds nothing we install.
          sudo sed -i 's/ restricted//g' /etc/apt/sources.list

          # A dead mirror otherwise costs 120s per index file before failover.
          printf '%s\n' \
            'APT::Keep-Downloaded-Packages "true";' \
            'Acquire::Languages "none";' \
            'Acquire::Retries "2";' \
            'Acquire::http::Timeout "15";' \
            'Acquire::https::Timeout "15";' \
            'Acquire::Check-Valid-Until "false";' \
            | sudo tee /etc/apt/apt.conf.d/99ci > /dev/null

          # Restore both halves before updating; update keeps the restored
          # indices for any source it cannot reach.
          sudo cp -a ~/apt-lists/. /var/lib/apt/lists/ 2>/dev/null || true
          sudo chown -R root:root /var/lib/apt/lists
          sudo cp -n ~/apt-archives/*.deb /var/cache/apt/archives/ 2>/dev/null || true

          sudo apt-get -y update
          sudo apt-get -y install --no-install-recommends \
            clang-21 lld-21 libclang-rt-21-dev llvm-21
          sudo apt-get -y install g++-14 libgtk-3-dev libx11-xcb-dev ninja-build cmake libfontconfig1-dev libxtst-dev \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev \
            libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxss-dev libxkbcommon-dev libxfixes-dev

          rm -rf ~/apt-lists
          mkdir -p ~/apt-archives ~/apt-lists
          sudo cp -n /var/cache/apt/archives/*.deb ~/apt-archives/ 2>/dev/null || true
          sudo find /var/lib/apt/lists -maxdepth 1 -type f ! -name lock \
            -exec cp -a {} ~/apt-lists/ \;
          sudo chown -R "$(id -u):$(id -g)" ~/apt-archives ~/apt-lists
          ls ~/apt-archives/*.deb > /dev/null 2>&1 || echo "::warning::no .debs staged, apt cache will save empty"

          # Download linuxdeploy if not cached.
          if [ '${{ steps.cache-linuxdeploy.outputs.cache-hit }}' != 'true' ]; then
            mkdir -p ~/linuxdeploy
            wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage -O ~/linuxdeploy/linuxdeploy
            wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage -O ~/linuxdeploy/linuxdeploy-plugin-appimage
            chmod +x ~/linuxdeploy/linuxdeploy ~/linuxdeploy/linuxdeploy-plugin-appimage
          fi
          echo "$HOME/linuxdeploy" >> $GITHUB_PATH

          # Update submodules
          git submodule update --init --depth=1 -j$(getconf _NPROCESSORS_ONLN) $(grep -oP '(?<=path = )(?!third_party\/DirectXShaderCompiler).+' .gitmodules)

          # Fetch data repos (game-patches)
          ./xenia-build.py fetchdata
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10
      - name: Build
        env:
          CC: clang-21
          CXX: clang++-21
          SCCACHE_GHA_ENABLED: "true"
          CMAKE_C_COMPILER_LAUNCHER: sccache
          CMAKE_CXX_COMPILER_LAUNCHER: sccache
        run: ./xenia-build.py build --config=Release
      - name: sccache stats
        if: always()
        run: sccache --show-stats
      - name: Prepare artifacts
        id: prepare_artifacts
        run: |
          binary=build/bin/Linux/Release/xenia_edge
          if [ $(stat -c%s $binary) -le 100000 ]; then
            echo "::error::Binary is too small."
          fi
          chmod +x $binary
          mkdir -p artifacts/xenia_edge

          # Install icons with proper naming for linuxdeploy
          mkdir -p artifacts/xenia_edge/usr/share/icons/hicolor/16x16/apps
          mkdir -p artifacts/xenia_edge/usr/share/icons/hicolor/32x32/apps
          mkdir -p artifacts/xenia_edge/usr/share/icons/hicolor/48x48/apps
          mkdir -p artifacts/xenia_edge/usr/share/icons/hicolor/64x64/apps
          mkdir -p artifacts/xenia_edge/usr/share/icons/hicolor/128x128/apps
          mkdir -p artifacts/xenia_edge/usr/share/icons/hicolor/256x256/apps
          mkdir -p artifacts/xenia_edge/usr/share/icons/hicolor/512x512/apps
          mkdir -p artifacts/xenia_edge/usr/share/icons/hicolor/1024x1024/apps

          cp assets/icon/16.png artifacts/xenia_edge/usr/share/icons/hicolor/16x16/apps/xenia_edge.png
          cp assets/icon/32.png artifacts/xenia_edge/usr/share/icons/hicolor/32x32/apps/xenia_edge.png
          cp assets/icon/48.png artifacts/xenia_edge/usr/share/icons/hicolor/48x48/apps/xenia_edge.png
          cp assets/icon/64.png artifacts/xenia_edge/usr/share/icons/hicolor/64x64/apps/xenia_edge.png
          cp assets/icon/128.png artifacts/xenia_edge/usr/share/icons/hicolor/128x128/apps/xenia_edge.png
          cp assets/icon/256.png artifacts/xenia_edge/usr/share/icons/hicolor/256x256/apps/xenia_edge.png
          cp assets/icon/512.png artifacts/xenia_edge/usr/share/icons/hicolor/512x512/apps/xenia_edge.png
          cp assets/icon/1024.png artifacts/xenia_edge/usr/share/icons/hicolor/1024x1024/apps/xenia_edge.png

          mkdir -p artifacts/xenia_edge/usr/bin

          ~/linuxdeploy/linuxdeploy --appdir artifacts/xenia_edge \
            --executable $binary \
            --desktop-file assets/xenia_edge.desktop \
            --icon-file assets/icon/256.png \
            --output appimage

          # linuxdeploy creates the AppImage in the current directory
          # Find and rename it to a standard name
          appimage_file=$(ls -1 *.AppImage | head -n1)
          if [ -z "$appimage_file" ]; then
            echo "::error::AppImage file not found after linuxdeploy"
            exit 1
          fi

          # Create final artifacts directory and move the AppImage there
          mkdir -p artifacts/release
          mv "$appimage_file" artifacts/release/xenia_edge.AppImage
          chmod +x artifacts/release/xenia_edge.AppImage

          # Also copy LICENSE
          cp LICENSE artifacts/release/
      - name: Upload xenia edge artifacts
        if: steps.prepare_artifacts.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: xenia_edge_linux
          path: artifacts/release
          if-no-files-found: error

  build-macos-arm64:
    name: Build macOS ARM64
    needs: lint
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Cache Slang
        id: cache-slang
        uses: actions/cache@v5
        with:
          path: .slang
          # Keep in sync with SLANG_VERSION in xenia-build.py.
          key: ${{ runner.os }}-${{ runner.arch }}-slang-2026.8

      - name: Download Slang
        if: steps.cache-slang.outputs.cache-hit != 'true'
        run: ./xenia-build.py slang

      - name: Cache Metal Shader Converter
        id: cache-msc
        uses: actions/cache@v5
        with:
          path: .metal-shader-converter
          # Keep in sync with MSC_VERSION in xenia-build.py.
          key: ${{ runner.os }}-metal-shader-converter-4.0-beta2

      - name: Download Metal Shader Converter
        if: steps.cache-msc.outputs.cache-hit != 'true'
        run: ./xenia-build.py msc

      - name: Setup
        run: |
          # Update submodules. Skip DirectXShaderCompiler (the DXIL that the
          # Metal backend converts comes from mesa's spirv_to_dxil, not
          # dxilconv).
          git submodule update --init --depth=1 -j$(sysctl -n hw.ncpu) \
            $(grep -oE 'path = .+' .gitmodules | sed 's/path = //' \
              | grep -v 'DirectXShaderCompiler')

          # wxWidgets has nested submodules (pcre, libpng, ...) needed when
          # building from vendored source.
          git submodule update --init --recursive --depth=1 \
            -j$(sysctl -n hw.ncpu) third_party/wxWidgets

          # Fetch data repos (game-patches)
          ./xenia-build.py fetchdata

      # The runner's default python3 is Homebrew's and refuses pip installs
      # (PEP 668). mesa imports mako from whichever python3 it finds on PATH.
      - name: Set up Python for Meson
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install Meson for spirv_to_dxil
        run: python3 -m pip install --upgrade meson mako pyyaml packaging

      - name: Install Metal Toolchain
        # Apple's MobileAsset catalog fetch is flaky; retry with backoff.
        run: |
          for attempt in 1 2 3 4 5; do
            if sudo xcodebuild -downloadComponent MetalToolchain; then
              exit 0
            fi
            if [ $attempt -lt 5 ]; then
              delay=$((attempt * 30))
              echo "::warning::MetalToolchain download attempt $attempt failed; retrying in ${delay}s"
              sleep $delay
            fi
          done
          echo "::error::MetalToolchain download failed after 5 attempts"
          exit 1

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10
      - name: Build
        env:
          SCCACHE_GHA_ENABLED: "true"
          CMAKE_C_COMPILER_LAUNCHER: sccache
          CMAKE_CXX_COMPILER_LAUNCHER: sccache
        run: ./xenia-build.py build --config=Release --target=xenia-app
      - name: sccache stats
        if: always()
        run: sccache --show-stats

      - name: Prepare artifacts
        id: prepare_artifacts
        run: |
          app_bundle="build/bin/macOS/Release/Xenia-edge.app"
          if [ ! -d "$app_bundle" ]; then
            echo "::error::App bundle not found at $app_bundle"
            ls -la build/bin/macOS/Release/ 2>&1 || true
            exit 1
          fi
          main_exe="$app_bundle/Contents/MacOS/Xenia-edge"
          if [ "$(stat -f%z "$main_exe")" -le 100000 ]; then
            echo "::error::$main_exe is too small."
            exit 1
          fi
          # Confirm we actually produced an arm64 binary (not x86_64).
          if ! file "$main_exe" | grep -q "arm64"; then
            echo "::error::$main_exe is not arm64:"
            file "$main_exe"
            exit 1
          fi

          # DMG with an Applications symlink for drag-install UX.
          mkdir -p dmg_contents
          cp -R "$app_bundle" dmg_contents/
          cp LICENSE dmg_contents/
          ln -s /Applications dmg_contents/Applications

          mkdir -p artifacts/release
          hdiutil create -volname "Xenia-edge" \
            -srcfolder dmg_contents -ov -format UDZO \
            artifacts/release/xenia_edge_macos.dmg
          rm -rf dmg_contents

      - name: Upload xenia edge macOS artifacts
        if: steps.prepare_artifacts.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: xenia_edge_macos
          path: artifacts/release
          if-no-files-found: error

  build-ios-unsigned:
    name: Build unsigned iOS 18+ IPA
    # Do not unexpectedly add a multi-hour iOS build to callers of this reusable
    # workflow. A caller may opt in with build_ios_unsigned=true.
    if: >-
      inputs.build_ios_unsigned ||
      (github.workflow_ref == format('{0}/.github/workflows/build.yml@{1}', github.repository, github.ref) &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')))
    needs: lint
    runs-on: macos-latest
    timeout-minutes: 360
    permissions:
      contents: read
    env:
      MSC_IOS_REPO: xenios-jp/metal-shader-converter
      MSC_IOS_RELEASE_TAG: ios-4.0.3
      MSC_IOS_SHA256: bd6b729dcbde133a511d95130eb4d287a1e18b4170453f8b350e78a20bfc37aa
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: false

      - name: Show Apple toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Cache Slang
        id: cache-slang-ios
        uses: actions/cache@v5
        with:
          path: .slang
          key: ${{ runner.os }}-${{ runner.arch }}-slang-2026.8

      - name: Download Slang
        if: steps.cache-slang-ios.outputs.cache-hit != 'true'
        run: ./xenia-build.py slang

      - name: Cache Metal Shader Converter (macOS host tool)
        id: cache-msc-macos-ios
        uses: actions/cache@v5
        with:
          path: .metal-shader-converter
          key: ${{ runner.os }}-metal-shader-converter-4.0-beta2

      - name: Download Metal Shader Converter (macOS host tool)
        if: steps.cache-msc-macos-ios.outputs.cache-hit != 'true'
        run: ./xenia-build.py msc

      - name: Download iPhoneOS Metal Shader Converter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/msc-ios"
          gh release download "$MSC_IOS_RELEASE_TAG" --repo "$MSC_IOS_REPO" \
            --pattern libmetalirconverter.dylib \
            --dir "$RUNNER_TEMP/msc-ios" --clobber
          dylib="$RUNNER_TEMP/msc-ios/libmetalirconverter.dylib"
          echo "$MSC_IOS_SHA256  $dylib" | shasum -a 256 -c -
          lipo -verify_arch arm64 "$dylib"
          msc_build_info="$(xcrun vtool -show-build "$dylib")"
          grep -q 'platform IOS' <<<"$msc_build_info" || {
            echo 'error: Metal Shader Converter binary is not built for iPhoneOS' >&2
            exit 1
          }
          python3 - "$msc_build_info" <<'PY'
          import re
          import sys

          match = re.search(r"^\s*minos\s+(\d+(?:\.\d+)*)", sys.argv[1], re.MULTILINE)
          if not match or tuple(map(int, match.group(1).split("."))) > (18, 0):
              raise SystemExit("error: embedded Metal Shader Converter requires newer than iOS 18")
          PY
          echo "MSC_IOS_LIBRARY=$dylib" >> "$GITHUB_ENV"

      - name: Fetch submodules and external data
        run: |
          set -euo pipefail
          git submodule update --init --depth=1 -j"$(sysctl -n hw.ncpu)" \
            $(grep -oE 'path = .+' .gitmodules | sed 's/path = //' \
              | grep -v 'DirectXShaderCompiler')
          git submodule update --init --recursive --depth=1 \
            -j"$(sysctl -n hw.ncpu)" third_party/wxWidgets
          ./xenia-build.py fetchdata

      - name: Set up Python for Mesa shader compilation
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install Mesa build dependencies
        run: python3 -m pip install --upgrade meson mako pyyaml packaging

      - name: Build native macOS shader compiler
        run: |
          set -euo pipefail
          cmake -S . -B build-host -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-host --target xenia-shader-cc
          tool="$(find build-host -type f -name xenia-shader-cc -perm -u+x -print -quit)"
          test -n "$tool"
          echo "XENIA_SHADER_CC=$GITHUB_WORKSPACE/$tool" >> "$GITHUB_ENV"

      - name: Configure iPhoneOS arm64 for iOS 18
        run: |
          set -euo pipefail
          cmake -S . -B build-ios -G 'Ninja Multi-Config' \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=18.0 \
            -DCMAKE_CONFIGURATION_TYPES=Release \
            -DXENIA_IOS_DISABLE_CODE_SIGNING=ON \
            -DXENIA_BUILD_IOS_TRACE_APP=OFF \
            -DXENIA_IOS_CRASH_REPORTER=OFF \
            -DXENIA_IOS_COMPATIBILITY_DATA_DIR="$GITHUB_WORKSPACE/build/data_repos/game-compatibility" \
            -DXENIA_IOS_HOST_SHADER_COMPILER="$XENIA_SHADER_CC" \
            -DXENIA_IOS_SHADER_CONVERTER_LIBRARY="$MSC_IOS_LIBRARY"

      - name: Build and package unsigned IPA
        run: |
          set -euo pipefail
          cmake --build build-ios --config Release --target xenia-app-ios-unsigned-package
          ipa=build-ios/XeniOS-unsigned.ipa
          test -s "$ipa"
          unzip -t "$ipa"
          unzip -Z1 "$ipa" | grep -qx 'Payload/XeniOS.app/Info.plist'
          unzip -Z1 "$ipa" | grep -qx 'Payload/XeniOS.app/XeniOS'
          unzip -Z1 "$ipa" | grep -q '^Payload/XeniOS.app/Frameworks/libmetalirconverter.dylib$'
          if unzip -Z1 "$ipa" | grep -q 'embedded.mobileprovision$'; then
            echo 'error: unsigned IPA unexpectedly contains a provisioning profile' >&2
            exit 1
          fi
          lipo -verify_arch arm64 build-ios/bin/iOS/Release/XeniOS.app/XeniOS

      - name: Upload unsigned iOS IPA
        uses: actions/upload-artifact@v7
        with:
          name: xenios-ios18-unsigned-ipa
          path: build-ios/XeniOS-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

  build-windows:
    name: Build Windows
    needs: lint
    runs-on: windows-2025
    env:
      POWERSHELL_TELEMETRY_OPTOUT: 1
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: false

      - name: Cache Slang
        id: cache-slang
        uses: actions/cache@v5
        with:
          path: .slang
          # Keep in sync with SLANG_VERSION in xenia-build.py.
          key: ${{ runner.os }}-${{ runner.arch }}-slang-2026.8

      - name: Download Slang
        if: steps.cache-slang.outputs.cache-hit != 'true'
        run: python xenia-build.py slang

      - name: Disable Defender scanning for build paths
        run: |
          Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE"
          Add-MpPreference -ExclusionPath "$env:RUNNER_TEMP"
        shell: pwsh

      - name: Setup
        run: |
          # Verify FXC is available (from Windows SDK)
          $fxcPaths = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\fxc.exe" -ErrorAction SilentlyContinue | Sort-Object FullName
          if ($fxcPaths) {
            $fxcPath = $fxcPaths[-1].FullName
            echo "FXC found at: $fxcPath"
          } else {
            echo "Warning: fxc.exe not found in Windows SDK"
          }

          git submodule update --init --depth=1 -j $env:NUMBER_OF_PROCESSORS (Select-String -CaseSensitive '(?<=path = ).+' .gitmodules).Matches.Value
          # wxWidgets needs its own nested submodules (pcre, libpng, ...) when
          # building from source on Windows.
          git submodule update --init --recursive --depth=1 -j $env:NUMBER_OF_PROCESSORS third_party/wxWidgets

          # Fetch data repos (game-patches)
          python xenia-build.py fetchdata

      - name: Install Meson for spirv_to_dxil
        # The D3D12 backend builds Mesa's spirv_to_dxil from the third_party/mesa
        # submodule via Meson. Ninja is already present (used by the main build),
        # and xenia-build.py imports the vcvars environment so Meson finds cl.
        run: python -m pip install --upgrade meson mako pyyaml packaging

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10
      - name: Build
        env:
          SCCACHE_GHA_ENABLED: "true"
          CMAKE_C_COMPILER_LAUNCHER: sccache
          CMAKE_CXX_COMPILER_LAUNCHER: sccache
        run: python xenia-build.py build --config=Release --target=xenia-app
      - name: sccache stats
        if: always()
        run: sccache --show-stats
      - name: Prepare artifacts
        id: prepare_artifacts
        run: |
          $binary = 'build\bin\Windows\Release\xenia_edge.exe'
          if ((get-item $binary).Length -le 100000) {
            echo "::error::$binary is too small."
          }
          robocopy . build\bin\Windows\Release LICENSE /r:0 /w:0
          # Copy all files and directories next to the binary, excluding
          # build intermediates.
          robocopy build\bin\Windows\Release artifacts\xenia_edge /MIR /r:0 /w:0 /XF *.lib *.idb *.exp
          If ($LastExitCode -le 7) { echo "LastExitCode = $LastExitCode";$LastExitCode = 0 }
      - name: Upload xenia edge artifacts
        if: steps.prepare_artifacts.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: xenia_edge_windows
          path: artifacts\xenia_edge
          if-no-files-found: error
